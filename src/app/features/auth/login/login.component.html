<div class="auth-page">
  <div class="auth-container">
    <!-- Brand Header -->
    <div class="auth-header">
      <a routerLink="/login" class="auth-brand">
        <svg class="logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="48" height="48" rx="12" fill="url(#upbGradientAuth)" />
          <defs>
            <linearGradient id="upbGradientAuth" x1="0" y1="24" x2="48" y2="24" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#F50C4B" />
              <stop offset="50%" stop-color="#D01C9E" />
              <stop offset="100%" stop-color="#A63CF2" />
            </linearGradient>
          </defs>
          <path d="M24 12L36 24L24 36" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          <path d="M12 24H36" stroke="white" stroke-width="3" stroke-linecap="round" />
        </svg>
        <span>Tutorías UPB</span>
      </a>
      <p class="auth-subtitle">Inicia sesión para acceder a tu cuenta</p>
    </div>

    <!-- Error Alert -->
    @if (error()) {
      <div class="alert alert-error" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <line x1="15" y1="9" x2="9" y2="15" />
          <line x1="9" y1="9" x2="15" y2="15" />
        </svg>
        <span>{{ error() }}</span>
      </div>
    }

    <!-- Login Form -->
    <form class="auth-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email" class="form-label">Correo Electrónico</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="2" y="4" width="20" height="16" rx="2" />
            <path d="M22 6L12 13L2 6" />
          </svg>
          <input 
            type="email" 
            id="email" 
            class="input" 
            [value]="email()"
            (input)="email.set($any($event.target).value)"
            placeholder="tu@email.upb.edu.co"
            autocomplete="email"
            required
            [disabled]="isLoading()"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Contraseña</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          <input 
            type="password" 
            id="password" 
            class="input" 
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            placeholder="••••••••"
            autocomplete="current-password"
            required
            [disabled]="isLoading()"
          />
        </div>
      </div>

      <div class="form-options">
        <label class="checkbox-wrapper">
          <input 
            type="checkbox" 
            [checked]="rememberMe()"
            (change)="rememberMe.set($any($event.target).checked)"
            [disabled]="isLoading()"
          />
          <span class="checkbox-custom"></span>
          <span>Recordarme</span>
        </label>
        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="isLoading()">
        @if (isLoading()) {
          <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="10" stroke-opacity="0.25" />
            <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round" />
          </svg>
          Iniciando sesión...
        } @else {
          Iniciar Sesión
        }
      </button>
    </form>

    <!-- Register Link -->
    <p class="auth-footer">
      ¿No tienes cuenta? 
      <a routerLink="/register">Regístrate aquí</a>
    </p>
  </div>

  <!-- Background decoration -->
  <div class="auth-bg" aria-hidden="true">
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>
  </div>
</div>
