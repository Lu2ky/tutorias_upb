<header class="header">
  <div class="header-container">
    <!-- Logo/Brand -->
    <a routerLink="/student/dashboard" class="header-brand" aria-label="Tutorías UPB - Inicio">
      <svg class="logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="48" height="48" rx="12" fill="url(#upbGradient)" />
        <defs>
          <linearGradient id="upbGradient" x1="0" y1="24" x2="48" y2="24" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#F50C4B" />
            <stop offset="50%" stop-color="#D01C9E" />
            <stop offset="100%" stop-color="#A63CF2" />
          </linearGradient>
        </defs>
        <path d="M24 12L36 24L24 36" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <path d="M12 24H36" stroke="white" stroke-width="3" stroke-linecap="round" />
      </svg>
      <span class="brand-text">Tutorías UPB</span>
    </a>

    <!-- Navigation -->
    <nav class="header-nav" aria-label="Navegación principal">
      <ul class="nav-list">
        @for (link of navLinks(); track link.route) {
          <li>
            <a 
              [routerLink]="link.route" 
              routerLinkActive="active" 
              class="nav-link"
              [attr.aria-current]="{ 'true': 'page' }"
            >
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                @switch (link.icon) {
                  @case ('dashboard') {
                    <rect x="3" y="3" width="7" height="7" rx="1" />
                    <rect x="14" y="3" width="7" height="7" rx="1" />
                    <rect x="3" y="14" width="7" height="7" rx="1" />
                    <rect x="14" y="14" width="7" height="7" rx="1" />
                  }
                  @case ('calendar') {
                    <rect x="3" y="4" width="18" height="18" rx="2" />
                    <line x1="16" y1="2" x2="16" y2="6" />
                    <line x1="8" y1="2" x2="8" y2="6" />
                    <line x1="3" y1="10" x2="21" y2="10" />
                  }
                  @case ('calendar-plus') {
                    <rect x="3" y="4" width="18" height="18" rx="2" />
                    <line x1="16" y1="2" x2="16" y2="6" />
                    <line x1="8" y1="2" x2="8" y2="6" />
                    <line x1="3" y1="10" x2="21" y2="10" />
                    <line x1="12" y1="14" x2="12" y2="20" />
                    <line x1="9" y1="17" x2="15" y2="17" />
                  }
                  @case ('book') {
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                  }
                  @case ('user') {
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                  }
                  @case ('home') {
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                  }
                  @default {
                    <circle cx="12" cy="12" r="10" />
                  }
                }
              </svg>
              <span>{{ link.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <!-- Theme Toggle -->
    <button class="theme-toggle" (click)="toggleTheme()" aria-label="Cambiar tema" [attr.aria-pressed]="theme() === 'dark'">
      @if (theme() === 'light') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="5" />
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
      }
    </button>

    <!-- User Menu -->
    <div class="header-user">
      @if (currentUser(); as user) {
        <div class="user-menu" [attr.aria-expanded]="showMenu">
          <button class="user-avatar" 
                  (click)="toggleMenu()" 
                  [attr.aria-expanded]="showMenu" 
                  aria-haspopup="true"
                  (keydown)="onUserMenuKeydown($event)">
            @if (user.avatar) {
              <img [src]="user.avatar" [alt]="user.name" />
            } @else {
              {{ getInitials(user.name) }}
            }
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </button>
          
          @if (showMenu) {
            <div class="user-dropdown" role="menu" tabindex="-1">
              <div class="dropdown-header">
                <strong>{{ user.name }}</strong>
                <span>{{ user.email }}</span>
                <span class="role-badge" [class]="'role-' + user.role">{{ user.role === 'tutor' ? 'Tutor' : 'Estudiante' }}</span>
              </div>
              <a [routerLink]="isTutor() ? '/tutor/profile' : '/student/profile'" class="dropdown-item" role="menuitem" tabindex="0" (keydown)="onDropdownKeydown($event)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
                Mi Perfil
              </a>
              <button class="dropdown-item danger" (click)="logout()" role="menuitem" tabindex="0" (keydown)="onDropdownKeydown($event)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                  <polyline points="16 17 21 12 16 7" />
                  <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                Cerrar Sesión
              </button>
            </div>
          }
        </div>
      }
    </div>

    <!-- Mobile menu toggle -->
    <button class="mobile-menu-toggle" aria-label="Abrir menú" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>
  </div>
</header>
